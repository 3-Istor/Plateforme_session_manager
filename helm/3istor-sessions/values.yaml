# Keep this at 1 while persistence uses the bundled SQLite database.
replicaCount: 1

image:
  repository: ghcr.io/3-istor/3istor-sessions
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

# Host header used by Kubernetes probes so TrustedHostMiddleware accepts them.
probeHost: "sessions.3istor.com"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Persistence is useful if you rely on the local SQLite database.
# Disable this if you configure a PostgreSQL DATABASE_URL via Vault secrets.
persistence:
  enabled: true
  storageClass: "local-path"
  accessMode: ReadWriteOnce
  size: 2Gi
  mountPath: /app/data

# Non-sensitive configuration variables.
env:
  - name: APP_ENV
    value: "production"
  - name: AUTH_MODE
    value: "google"
  - name: FRONTEND_URL
    value: "https://sessions.3istor.com"
  - name: GOOGLE_REDIRECT_URI
    value: "https://sessions.3istor.com/api/google/calendar/callback"
  - name: GOOGLE_TARGET_CALENDAR_ID
    value: "913d31d1666fcfd7a8ad0c6447679a0ceafdbff55a20adb5a2dea1f655f39c92@group.calendar.google.com"
  - name: ALLOWED_HOSTS
    value: "sessions.3istor.com,127.0.0.1"
  - name: SESSION_TTL_MINUTES
    value: "480"

# The name of the Kubernetes Secret (managed by your VaultSecretsOperator)
# containing APP_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# MANAGER_EMAIL and TEAM_MEMBERS. Add DATABASE_URL there only when disabling
# persistence above in favor of an external PostgreSQL database.
existingSecret: "3istor-sessions-secrets"
